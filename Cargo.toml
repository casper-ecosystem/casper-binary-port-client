[workspace]
resolver = "2"
members = ["binary-port-access"]

[package]
name = "casper-binary-port-client"
version = "0.1.0"
edition = "2021"
authors = ["Rafał Chabowski <rafal@casperlabs.io>"]
description = "CLI for Casper binary port."
license = "Apache-2.0"

[workspace.dependencies]
casper-types = { version = "7.1.1" }
casper-binary-port = { version = "1.2.1" }
thiserror = "2.0.19"

[dependencies]
casper-types = { workspace = true, features = ["std-fs-io"] }
casper-binary-port.workspace = true
thiserror.workspace = true
casper-binary-port-access = { path = "./binary-port-access" }
clap = { version = "4.6.4", features = ["derive", "wrap_help"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "net"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
erased-serde = "0.4.10"
rand = "0.9.2"

[patch.crates-io]
casper-types = { git = "https://github.com/casper-network/casper-node", tag = "v2.2.2" }
casper-binary-port = { git = "https://github.com/casper-network/casper-node", tag = "v2.2.2" }
